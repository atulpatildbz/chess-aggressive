<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aggressive Engine</title>
<style>
  :root {
    --bg: #302e2b; --panel: #262522; --panel2: #21201d; --line: #3c3a37;
    --text: #e8e6e3; --muted: #9e9b98; --green: #81b64c; --green-h: #95c95f;
    --light: #e6cfa6; --dark: #a87b55;
    --size: min(calc(100vh - 150px), calc(100vw - 32px), 720px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
               font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
  main { display: flex; gap: 20px; justify-content: center; align-items: flex-start; padding: 16px; flex-wrap: wrap; }

  /* ---------- player bars ---------- */
  .player { width: var(--size); height: 46px; display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .avatar { width: 38px; height: 38px; border-radius: 4px; display: grid; place-items: center; flex: none; }
  .avatar img { width: 32px; height: 32px; }
  .player .name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .player .badge { font-size: 11px; font-weight: 600; background: #b33430; color: #fff; padding: 0 5px; border-radius: 3px; }
  .player .caps { display: flex; align-items: center; height: 18px; margin-top: 1px; }
  .player .caps img { width: 18px; height: 18px; margin-right: -6px; }
  .player .caps .gap { width: 10px; }
  .player .caps .diff { margin-left: 10px; font-size: 12px; color: var(--muted); }
  .thinking { display: none; font-size: 12px; color: var(--muted); font-weight: 400; }
  .thinking.on { display: inline; }
  .thinking.on::after { content: "…"; animation: dots 1.2s steps(3) infinite; display: inline-block; width: 1em; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0 } to { width: 1em } }

  /* ---------- board ---------- */
  #board { position: relative; width: var(--size); height: var(--size); border-radius: 3px; overflow: hidden;
           user-select: none; touch-action: none; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  .sq { position: absolute; width: 12.5%; height: 12.5%; }
  .sq.l { background-color: var(--light);
          background-image:
            repeating-linear-gradient(var(--a), rgba(120,80,40,.10) 0 1px, transparent 1px 5px),
            repeating-linear-gradient(calc(var(--a) + 3deg), rgba(255,255,255,.10) 0 2px, transparent 2px 9px),
            linear-gradient(var(--a), rgba(255,255,255,.08), rgba(140,95,50,.10)); }
  .sq.d { background-color: var(--dark);
          background-image:
            repeating-linear-gradient(var(--a), rgba(60,30,10,.16) 0 1px, transparent 1px 4px),
            repeating-linear-gradient(calc(var(--a) - 2deg), rgba(255,220,180,.08) 0 2px, transparent 2px 8px),
            linear-gradient(var(--a), rgba(255,255,255,.05), rgba(50,25,5,.15)); }
  .hl { position: absolute; width: 12.5%; height: 12.5%; pointer-events: none; }
  .hl.last { background: rgba(255, 186, 40, .42); }
  .hl.sel { background: rgba(255, 186, 40, .55); }
  .hl.check { background: radial-gradient(circle, rgba(255,0,0,.85) 0%, rgba(231,0,0,.55) 30%, rgba(169,0,0,0) 72%); }
  .hl.hover { box-shadow: inset 0 0 0 4px rgba(255,255,255,.75); }
  .hl.dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 33%; height: 33%;
                   transform: translate(-50%,-50%); border-radius: 50%; background: rgba(0,0,0,.14); }
  .hl.ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
                    border: calc(var(--size) / 8 * .09) solid rgba(0,0,0,.14); }
  .coord { position: absolute; font-weight: 700; font-size: calc(var(--size) / 8 * .19); pointer-events: none; z-index: 1; }
  .coord.r { left: 4%; top: 2%; } .coord.f { right: 5%; bottom: 1%; }
  .sq.l .coord { color: #a87b55; } .sq.d .coord { color: #ecd8b6; }
  .pc { position: absolute; width: 12.5%; height: 12.5%; z-index: 2; pointer-events: none;
        background-size: 100%; will-change: transform; }
  .pc.anim { transition: transform .16s ease-out; }
  .pc.drag { z-index: 10; transition: none; cursor: grabbing; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  #board.mine { cursor: pointer; }

  #promo { position: absolute; z-index: 20; width: 12.5%; background: #fff; border-radius: 3px;
           box-shadow: 0 4px 18px rgba(0,0,0,.5); display: none; flex-direction: column; overflow: hidden; }
  #promo button { aspect-ratio: 1; border: 0; background: #fff center/90% no-repeat; cursor: pointer; }
  #promo button:hover { background-color: #f0e6d4; }

  #over { position: absolute; inset: 0; z-index: 30; display: none; place-items: center; background: rgba(0,0,0,.35); }
  #over .box { background: var(--panel); border-radius: 8px; width: 270px; padding: 22px 20px 18px; text-align: center;
               box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #over h2 { margin: 0 0 4px; font-size: 24px; }
  #over p { margin: 0 0 16px; color: var(--muted); }

  /* ---------- side panel ---------- */
  aside { width: 360px; max-width: calc(100vw - 32px); background: var(--panel); border-radius: 6px;
          display: flex; flex-direction: column; height: calc(var(--size) + 92px); overflow: hidden; }
  .head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .head h1 { font-size: 17px; margin: 0; flex: 1; }
  .head h1 small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .opts { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .seg { display: flex; background: var(--panel2); border-radius: 5px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 4px;
                font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.on { background: #45423e; color: var(--text); }
  #moves { flex: 1; overflow-y: auto; font-size: 14px; }
  #moves .mr { display: grid; grid-template-columns: 46px 1fr 1fr; padding: 3px 0; }
  #moves .mr:nth-child(even) { background: #2b2926; }
  #moves .n { color: var(--muted); padding-left: 16px; }
  #moves .m { padding: 0 6px; border-radius: 3px; justify-self: start; font-weight: 600; }
  #moves .m.cur { background: #4a4743; border-bottom: 2px solid #6f6b66; }
  #why { border-top: 1px solid var(--line); padding: 12px 16px; font-size: 13px; min-height: 120px; }
  #why h3 { margin: 0 0 2px; font-size: 14px; }
  #why .ev { color: var(--muted); }
  #why .tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
  #why .tag { background: rgba(129,182,76,.16); color: #a6d273; border-radius: 99px; padding: 1px 8px; font-size: 12px; }
  #why .tag.hot { background: rgba(230, 90, 60, .18); color: #f39a80; }
  #why table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #why td { padding: 1px 0; color: var(--muted); } #why td:first-child { color: var(--text); }
  #why td:nth-child(n+2) { text-align: right; }
  #why tr.pick td { color: var(--green-h); font-weight: 600; }
  #why tr.out td { opacity: .4; }
  .bar { display: grid; grid-template-columns: 1.4fr 1fr 1fr .8fr; gap: 6px; padding: 10px 12px; background: var(--panel2); }
  .btn { flex: 1; white-space: nowrap; border: 0; border-radius: 5px; padding: 10px 8px; background: #3c3a37; color: var(--text);
         font: inherit; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #4a4743; }
  .btn.go { background: var(--green); color: #fff; box-shadow: 0 3px 0 #45753c; }
  .btn.go:hover { background: var(--green-h); }
  @media (max-width: 1100px) { aside { height: auto; } #moves { max-height: 240px; } }
</style>
</head>
<body>
<main>
  <section>
    <div class="player" id="top"></div>
    <div id="board">
      <div id="promo"></div>
      <div id="over"><div class="box"><h2 id="overTitle"></h2><p id="overText"></p>
        <button class="btn go" onclick="newGame()">New game</button></div></div>
    </div>
    <div class="player" id="bottom"></div>
  </section>

  <aside>
    <div class="head">
      <h1>Aggressive Engine<small>Stockfish brain, attacker's heart</small></h1>
    </div>
    <div class="opts">
      <div class="seg" id="colorSeg">
        <button data-v="w" class="on">White</button><button data-v="b">Black</button>
      </div>
      <div class="seg" id="thinkSeg">
        <button data-v="0.5">Fast</button><button data-v="1" class="on">Normal</button><button data-v="2.5">Deep</button>
      </div>
    </div>
    <div id="moves"></div>
    <div id="why"><h3>Engine's reasoning</h3><div class="ev">The engine explains each move it plays here.</div></div>
    <div class="bar">
      <button class="btn go" id="new">New game</button>
      <button class="btn" id="undo" title="Take back">↶ Undo</button>
      <button class="btn" id="flip" title="Flip board">⇅ Flip</button>
      <button class="btn" id="pgn" title="Copy PGN">PGN</button>
    </div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const FILES = "abcdefgh";
const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
const TAGS = { sac: ["sacrifice", 1], trap: ["sets a trap", 1], pressure: ["few safe replies", 0],
  check: ["check", 1], kzone: ["hits king zone", 1], kdist: ["closer to king", 0], storm: ["pawn storm", 1],
  threat: ["creates threats", 0], offbeat: ["offbeat", 0], wing: ["flank thrust", 1] };
const img = c => `/pieces/${c === c.toUpperCase() ? "w" : "b"}${c.toUpperCase()}.svg`;

let moves = [], st = null, me = "w", flipped = false, sel = null, busy = false, think = 1, drag = null;
const board = $("board");

// ---------- sound (synthesised "thock") ----------
let actx;
function sound(capture) {
  try {
    actx = actx || new AudioContext();
    const t = actx.currentTime, len = capture ? .12 : .07;
    const buf = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, capture ? 3 : 6);
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    f.type = "bandpass"; f.frequency.value = capture ? 900 : 1500; f.Q.value = 1.2; g.gain.value = capture ? 1.4 : 1;
    src.buffer = buf; src.connect(f).connect(g).connect(actx.destination); src.start(t);
  } catch {}
}

// ---------- api ----------
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---------- geometry ----------
function parseFen(fen) {
  const b = {};
  fen.split(" ")[0].split("/").forEach((row, i) => { let f = 0;
    for (const ch of row) /\d/.test(ch) ? f += +ch : b[FILES[f++] + (8 - i)] = ch; });
  return b;
}
const xy = sq => { const f = FILES.indexOf(sq[0]), r = +sq[1] - 1;
  return flipped ? [7 - f, r] : [f, 7 - r]; };
const place = (el, sq) => { const [x, y] = xy(sq); el.style.left = x * 12.5 + "%"; el.style.top = y * 12.5 + "%"; };
function sqAt(e) {
  const r = board.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * 8), y = Math.floor((e.clientY - r.top) / r.height * 8);
  if (x < 0 || x > 7 || y < 0 || y > 7) return null;
  return flipped ? FILES[7 - x] + (y + 1) : FILES[x] + (8 - y);
}

// ---------- rendering ----------
function drawSquares() {
  board.querySelectorAll(".sq").forEach(e => e.remove());
  for (let x = 0; x < 8; x++) for (let y = 0; y < 8; y++) {
    const f = flipped ? 7 - x : x, r = flipped ? y : 7 - y, d = document.createElement("div");
    d.className = "sq " + ((f + r) % 2 ? "l" : "d");
    d.style.left = x * 12.5 + "%"; d.style.top = y * 12.5 + "%";
    d.style.setProperty("--a", (88 + ((f * 7 + r * 13) % 9) - 4) + "deg");
    if (x === 0) d.insertAdjacentHTML("beforeend", `<span class="coord r">${r + 1}</span>`);
    if (y === 7) d.insertAdjacentHTML("beforeend", `<span class="coord f">${FILES[f]}</span>`);
    board.prepend(d);
  }
}

function render() {
  board.querySelectorAll(".pc,.hl").forEach(e => e.remove());
  const pos = parseFen(st.fen);
  const hl = (sq, cls) => { const e = document.createElement("div"); e.className = "hl " + cls; place(e, sq); board.append(e); };
  if (st.last) { hl(st.last.slice(0, 2), "last"); hl(st.last.slice(2, 4), "last"); }
  if (st.check) hl(Object.keys(pos).find(s => pos[s] === (st.turn === "w" ? "K" : "k")), "check");
  if (sel) {
    hl(sel, "sel");
    new Set(st.legal.filter(m => m.startsWith(sel)).map(m => m.slice(2, 4)))
      .forEach(t => hl(t, pos[t] ? "ring" : "dot"));
  }
  for (const [sq, c] of Object.entries(pos)) {
    const p = document.createElement("div"); p.className = "pc"; p.dataset.sq = sq;
    p.style.backgroundImage = `url(${img(c)})`; place(p, sq); board.append(p);
  }
  board.classList.toggle("mine", !busy && !st.over && st.turn === me);
  renderPlayers(pos); renderMoves(); renderOver();
}

function renderPlayers(pos) {
  const start = { p: 8, n: 2, b: 2, r: 2, q: 1 };
  const count = c => Object.values(pos).filter(x => x === c).length;
  const capsOf = color => {           // pieces this color has captured
    const opp = color === "w" ? s => s : s => s.toUpperCase();
    let html = "", mat = 0;
    for (const t of ["p", "n", "b", "r", "q"]) {
      const n = Math.max(0, start[t] - count(opp(t)));
      for (let i = 0; i < n; i++) html += `<img src="${img(opp(t))}">`;
      if (n) html += '<span class="gap"></span>';
    }
    for (const t in start) mat += VAL[t] * (count(t.toUpperCase()) - count(t));
    return { html, mat: color === "w" ? mat : -mat };
  };
  const bar = (who, color) => {
    const c = capsOf(color), bot = who === "bot";
    return `<div class="avatar" style="background:${bot ? "#7a2e22" : "#4b6b3a"}"><img src="${img(color === "w" ? (bot ? "Q" : "K") : (bot ? "q" : "k"))}"></div>
      <div><div class="name">${bot ? 'Aggressive Bot <span class="badge">BOT</span><span class="thinking' + (busy ? " on" : "") + '">thinking</span>' : "You"}</div>
      <div class="caps">${c.html}${c.mat > 0 ? `<span class="diff">+${c.mat}</span>` : ""}</div></div>`;
  };
  const bot = me === "w" ? "b" : "w";
  const topIsBot = flipped === (me === "b") ? true : false;
  $("top").innerHTML = topIsBot ? bar("bot", bot) : bar("me", me);
  $("bottom").innerHTML = topIsBot ? bar("me", me) : bar("bot", bot);
}

function renderMoves() {
  const m = $("moves"); let h = "";
  for (let i = 0; i < st.san.length; i += 2) {
    const cur = j => j === st.san.length - 1 ? " cur" : "";
    h += `<div class="mr"><span class="n">${i / 2 + 1}.</span><span class="m${cur(i)}">${st.san[i]}</span>
          <span class="m${cur(i + 1)}">${st.san[i + 1] || ""}</span></div>`;
  }
  m.innerHTML = h; m.scrollTop = m.scrollHeight;
}

function renderOver() {
  if (!st.over) { $("over").style.display = "none"; return; }
  const youWin = (st.result === "1-0" && me === "w") || (st.result === "0-1" && me === "b");
  $("overTitle").textContent = st.result === "1/2-1/2" ? "Draw" : youWin ? "You won!" : "Aggressive Bot won";
  $("overText").textContent = st.result;
  $("over").style.display = "grid";
}

// ---------- input: click & drag ----------
const pieceEl = sq => board.querySelector(`.pc[data-sq="${sq}"]`);
const isMine = (pos, sq) => pos[sq] && ((pos[sq] === pos[sq].toUpperCase()) === (me === "w"));
const canMove = () => !busy && st && !st.over && st.turn === me;

board.addEventListener("pointerdown", e => {
  if (!canMove() || e.button !== 0 || e.target.closest("#promo,#over")) return;
  const sq = sqAt(e); if (!sq) return;
  const pos = parseFen(st.fen);
  if (sel && sel !== sq && tryMove(sel, sq)) return;
  if (isMine(pos, sq)) {
    const wasSel = sel === sq; sel = sq; render();
    const el = pieceEl(sq); el.classList.add("drag");
    drag = { sq, el, wasSel, moved: false, x0: e.clientX, y0: e.clientY };
    board.setPointerCapture(e.pointerId); follow(e);
  } else { sel = null; render(); }
});
board.addEventListener("pointermove", e => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 4) drag.moved = true;
  follow(e);
  board.querySelectorAll(".hl.hover").forEach(h => h.remove());
  const sq = sqAt(e);
  if (sq && drag.moved) { const h = document.createElement("div"); h.className = "hl hover"; place(h, sq); board.append(h); }
});
board.addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null; const sq = sqAt(e);
  if (sq && sq !== d.sq && tryMove(d.sq, sq)) return;
  if (sq === d.sq && d.wasSel && !d.moved) sel = null;
  render();
});
function follow(e) {
  const r = board.getBoundingClientRect(), s = r.width / 8, [x, y] = xy(drag.sq);
  drag.el.style.transform = `translate(${e.clientX - r.left - s / 2 - x * s}px, ${e.clientY - r.top - s / 2 - y * s}px)`;
}

function tryMove(from, to) {
  const cands = st.legal.filter(m => m.startsWith(from + to));
  if (!cands.length) return false;
  if (cands.length > 1) { promote(to, cands); return true; }
  play(cands[0]); return true;
}

function promote(to, cands) {
  const box = $("promo"), color = me === "w" ? (s => s.toUpperCase()) : (s => s);
  box.innerHTML = "";
  for (const p of ["q", "n", "r", "b"]) {
    const b = document.createElement("button"); b.style.backgroundImage = `url(${img(color(p))})`;
    b.onclick = ev => { ev.stopPropagation(); box.style.display = "none"; play(cands.find(m => m.endsWith(p))); };
    box.append(b);
  }
  const [x, y] = xy(to); box.style.left = x * 12.5 + "%"; box.style.top = (y < 4 ? y : y - 3) * 12.5 + "%";
  box.style.display = "flex"; render(); board.append(box);
}

function animate(uci) {
  return new Promise(res => {
    const el = pieceEl(uci.slice(0, 2)); if (!el) return res();
    const r = board.getBoundingClientRect(), s = r.width / 8;
    const [x0, y0] = xy(uci.slice(0, 2)), [x1, y1] = xy(uci.slice(2, 4));
    el.classList.add("anim"); el.style.zIndex = 5;
    requestAnimationFrame(() => el.style.transform = `translate(${(x1 - x0) * s}px, ${(y1 - y0) * s}px)`);
    setTimeout(res, 170);
  });
}

async function play(uci) {
  sel = null;
  const capture = !!parseFen(st.fen)[uci.slice(2, 4)];
  moves.push(uci);
  st = await api("/api/state", { moves }); sound(capture); render();
  if (!st.over) engineMove();
}

async function engineMove() {
  busy = true; render();
  try {
    const res = await api("/api/engine", { moves, time: think });
    if (res.engine) {
      const capture = !!parseFen(st.fen)[res.engine.move.slice(2, 4)];
      await animate(res.engine.move);
      moves.push(res.engine.move); explain(res.engine); sound(capture);
    }
    st = res;
  } catch (e) { $("why").innerHTML = `<h3>Error</h3><div class="ev">${e.message}. Is server.py running?</div>`; }
  busy = false; render();
}

function explain(e) {
  const pawns = v => v == null ? "?" : Math.abs(v) >= 9000 ? (v > 0 ? "#" : "-#") : (v >= 0 ? "+" : "") + (v / 100).toFixed(2);
  const tags = Object.entries(e.bonus).filter(([k, v]) => TAGS[k] && v > 0).sort((a, b) => b[1] - a[1])
    .map(([k]) => `<span class="tag${TAGS[k][1] ? " hot" : ""}">${TAGS[k][0]}</span>`).join("");
  const cost = e.best_eval != null && e.eval != null ? e.best_eval - e.eval : 0;
  $("why").innerHTML = `<h3>Bot played ${e.san}</h3>
    <div class="ev">Eval for bot: ${pawns(e.eval)}${cost > 15 ? ` &middot; gave up ${(cost / 100).toFixed(1)} for the attack` : ""}</div>
    <div class="tags">${tags || '<span class="tag">solid</span>'}</div>
    <table>${e.candidates.map(c => `<tr class="${c.san === e.san ? "pick" : ""} ${c.allowed ? "" : "out"}">
      <td>${c.san}</td><td>${pawns(c.eval)}</td><td>${c.score}</td></tr>`).join("")}</table>`;
}

// ---------- controls ----------
function seg(id, fn) {
  $(id).querySelectorAll("button").forEach(b => b.onclick = () => {
    $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); fn(b.dataset.v); });
}
seg("colorSeg", v => { me = v; newGame(); });
seg("thinkSeg", v => think = +v);

async function newGame() {
  if (busy) return;
  flipped = me === "b"; moves = []; sel = null; drawSquares();
  $("why").innerHTML = '<h3>Engine\'s reasoning</h3><div class="ev">The engine explains each move it plays here.</div>';
  st = await api("/api/state", { moves }); render();
  if (me === "b") engineMove();
}
$("new").onclick = newGame;
$("flip").onclick = () => { flipped = !flipped; drawSquares(); render(); };
$("undo").onclick = async () => {
  if (busy || !moves.length) return;
  moves.pop(); if (moves.length && (moves.length % 2 === 0) !== (me === "w")) moves.pop();
  sel = null; st = await api("/api/state", { moves }); render();
  if (st.turn !== me && !st.over) engineMove();
};
$("pgn").onclick = () => {
  const txt = st.san.map((s, i) => (i % 2 ? "" : `${i / 2 + 1}. `) + s).join(" ") + (st.result ? " " + st.result : "");
  navigator.clipboard.writeText(txt); $("pgn").textContent = "Copied"; setTimeout(() => $("pgn").textContent = "PGN", 1200);
};
// optional: start from a move list in the URL, e.g. #w:e2e4,e7e5
(async () => {
  const m = location.hash.match(/^#([wb]):(.*)$/);
  if (!m) return newGame();
  me = m[1]; flipped = me === "b"; moves = m[2].split(",").filter(Boolean);
  $("colorSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v === me));
  drawSquares(); st = await api("/api/state", { moves }); render();
  if (st.turn !== me && !st.over) engineMove();
})();
</script>
